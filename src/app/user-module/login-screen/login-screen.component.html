<main class="auth">

    <div class="auth__photo" aria-hidden="true"></div>

    <section class="auth__panel">
        <app-theme-toggle class="auth__theme"></app-theme-toggle>

        <form class="auth__form" [formGroup]="loginForm" (ngSubmit)="onLoginClick()">
            <app-logo class="auth__logo"></app-logo>

            <h1 class="auth__title">Entrar</h1>
            <p class="auth__lead">Continue de onde parou nas suas conversas.</p>

            <div class="field">
                <label for="login-email">E-mail</label>
                <input
                    id="login-email"
                    type="email"
                    autocomplete="email"
                    placeholder="voce@email.com"
                    formControlName="email"
                    [class.is-invalid]="emailErrorMessage"
                >
                @if (emailErrorMessage) {
                <p class="field__error">{{ emailErrorMessage }}</p>
                }
            </div>

            <div class="field">
                <label for="login-senha">Senha</label>
                <input
                    id="login-senha"
                    type="password"
                    autocomplete="current-password"
                    formControlName="password"
                    [class.is-invalid]="passwordErrorMessage"
                >
                @if (passwordErrorMessage) {
                <p class="field__error">{{ passwordErrorMessage }}</p>
                }
            </div>

            <button class="auth__submit" type="submit" [disabled]="enviando">
                {{ enviando ? 'Entrando…' : 'Entrar' }}
            </button>

            @if (erroMessage) {
            <p class="auth__status auth__status--error" role="alert">{{ erroMessage }}</p>
            }
            @if (sucessoMessage) {
            <p class="auth__status auth__status--success" role="status">{{ sucessoMessage }}</p>
            }

            <p class="auth__switch">
                Ainda não tem uma conta? <a routerLink="/usuario">Criar conta</a>
            </p>
        </form>
    </section>

</main>
